name: CI

# Triggers: Run on pull requests, pushes to main, and manual dispatch
'on':
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege permissions: only read repository contents
permissions:
  contents: read

# Concurrency: cancel superseded runs for the same workflow and branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Install and verify server dependencies
  server:
    name: Server CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            server/package.json

      - name: Install server dependencies
        # Uses npm install because package-lock.json is not committed in the repository
        run: npm install

  # Job 2: Install client dependencies and run production build
  client:
    name: Client CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            client/package.json

      - name: Install client dependencies
        # Uses npm install because package-lock.json is not committed in the repository
        run: npm install

      - name: Build client
        run: npm run build
